<html lang="en">

<title>ENTITY — AVIDAA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#fff;user-select:none}
#loading{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.6s}
#loading.hide{opacity:0;pointer-events:none}
#l-title{font-size:10px;letter-spacing:8px;color:rgba(255,255,255,0.3);text-transform:uppercase}
#l-sub{font-size:9px;letter-spacing:3px;color:rgba(100,200,255,0.5);text-transform:uppercase;min-width:180px;text-align:center}
.pbar-wrap{width:220px;height:1px;background:rgba(255,255,255,0.08)}
.pbar{height:100%;width:0;background:rgba(100,200,255,0.9);transition:width 0.2s}
#hud-top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:10;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0.65),transparent)}
#hud-title{font-size:9px;letter-spacing:6px;color:rgba(255,255,255,0.22);text-transform:uppercase}
#hud-emotion{font-size:9px;letter-spacing:4px;color:rgba(100,200,255,0.75);text-transform:uppercase;transition:color 0.4s}
#hud-fps{font-size:8px;letter-spacing:2px;color:rgba(255,255,255,0.13)}
#hud-bottom{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:7px}
.emo-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.4);padding:7px 14px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(10px);transition:all 0.2s;font-family:'Courier New',monospace}
.emo-btn:hover{background:rgba(100,200,255,0.08);border-color:rgba(100,200,255,0.35);color:rgba(100,200,255,0.9)}
.emo-btn.on{background:rgba(100,200,255,0.12);border-color:rgba(100,200,255,0.75);color:rgb(100,200,255)}
#hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:3px;color:rgba(255,255,255,0.12);text-transform:uppercase;z-index:10;pointer-events:none;white-space:nowrap}
#tooltip{position:fixed;pointer-events:none;z-index:20;padding:5px 12px;background:rgba(0,0,0,0.88);border:1px solid rgba(100,200,255,0.38);font-size:8px;letter-spacing:3px;color:rgba(100,200,255,0.9);text-transform:uppercase;display:none}
/* CHARACTER LIST — right side */
#char-list{position:fixed;right:16px;top:68px;z-index:10;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 140px);overflow-y:auto}
#char-list::-webkit-scrollbar{width:2px}
#char-list::-webkit-scrollbar-thumb{background:rgba(100,200,255,0.3)}
.char-item{background:rgba(5,5,15,0.80);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.32);padding:6px 12px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(10px);transition:all 0.2s;font-family:'Courier New',monospace;white-space:nowrap;display:flex;align-items:center;gap:8px;min-width:130px}
.char-item:hover{border-color:rgba(100,200,255,0.28);color:rgba(100,200,255,0.8)}
.char-item.active{background:rgba(100,200,255,0.10);border-color:rgba(100,200,255,0.65);color:rgb(100,200,255)}
.char-item.loading{opacity:0.5;pointer-events:none}
.char-num{font-size:7px;color:rgba(255,255,255,0.2);min-width:16px}
.char-item.active .char-num{color:rgba(100,200,255,0.5)}
.char-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.15);flex-shrink:0}
.char-item.active .char-dot{background:rgba(100,200,255,0.8)}
.char-item.loading .char-dot{background:rgba(255,200,0,0.8);animation:blink 0.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
/* Entity 02 Sketchfab button */
#snake-btn{position:fixed;right:16px;bottom:28px;z-index:10;background:rgba(5,5,15,0.82);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.32);padding:7px 14px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(10px);transition:all 0.2s;font-family:'Courier New',monospace}
#snake-btn:hover{border-color:rgba(100,200,255,0.28);color:rgba(100,200,255,0.8)}
#snake-btn.on{background:rgba(100,200,255,0.10);border-color:rgba(100,200,255,0.65);color:rgb(100,200,255)}
/* Stats */
#stats{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:10;pointer-events:none;display:flex;flex-direction:column;gap:12px}
.st{display:flex;flex-direction:column;gap:2px}
.st-l{font-size:7px;letter-spacing:2px;color:rgba(255,255,255,0.14);text-transform:uppercase}
.st-v{font-size:9px;letter-spacing:1px;color:rgba(100,200,255,0.5)}
/* Sketchfab overlay */
#sf-overlay{position:fixed;inset:0;z-index:50;display:none;background:#000;overflow:hidden}
#sf-iframe-container{position:absolute;top:0;left:0;width:100%;height:100%}
#sf-iframe-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
#sf-back{position:fixed;right:16px;bottom:28px;z-index:65;background:rgba(100,200,255,0.10);border:1px solid rgba(100,200,255,0.5);color:rgb(100,200,255);padding:7px 14px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Courier New',monospace;display:none}
.corner{position:fixed;width:18px;height:18px;z-index:10;pointer-events:none}
.corner.tl{top:12px;left:12px;border-top:1px solid rgba(255,255,255,0.1);border-left:1px solid rgba(255,255,255,0.1)}
.corner.tr{top:12px;right:12px;border-top:1px solid rgba(255,255,255,0.1);border-right:1px solid rgba(255,255,255,0.1)}
.corner.bl{bottom:12px;left:12px;border-bottom:1px solid rgba(255,255,255,0.1);border-left:1px solid rgba(255,255,255,0.1)}
.corner.br{bottom:12px;right:12px;border-bottom:1px solid rgba(255,255,255,0.1);border-right:1px solid rgba(255,255,255,0.1)}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px)}
/* ── NAV TABS ── */
#nav-tabs{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;z-index:30;background:rgba(0,0,0,0.7);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.05)}
.nav-tab{background:none;border:none;color:rgba(255,255,255,0.28);font-family:'Courier New',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;padding:8px 18px;transition:all 0.2s;border-bottom:1px solid transparent}
.nav-tab:hover{color:rgba(100,200,255,0.8)}
.nav-tab.on{color:rgb(100,200,255);border-bottom-color:rgba(100,200,255,0.6)}
/* ── HOME VIEW ── */
#view-home{position:fixed;inset:0;top:48px;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:transparent;transition:opacity 0.5s;pointer-events:auto}
#view-home.hide{opacity:0;pointer-events:none}
#view-home-bg{position:fixed;inset:0;top:48px;z-index:19;background:radial-gradient(ellipse at center,rgba(4,4,8,0.55) 0%,rgba(4,4,8,0.82) 100%);pointer-events:none}
#home-eyebrow{font-size:8px;letter-spacing:8px;color:rgba(100,200,255,0.35);text-transform:uppercase;margin-bottom:18px}
#home-title{font-size:clamp(48px,8vw,96px);letter-spacing:0.15em;color:rgba(255,255,255,0.92);text-transform:uppercase;font-weight:400;line-height:1;margin-bottom:8px}
#home-sub{font-size:9px;letter-spacing:5px;color:rgba(100,200,255,0.4);text-transform:uppercase;margin-bottom:52px}
.home-line{width:1px;height:40px;background:linear-gradient(to bottom,transparent,rgba(100,200,255,0.4),transparent);margin:0 auto 52px}
.home-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.home-btn{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.10);color:rgba(255,255,255,0.5);padding:12px 28px;font-size:9px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:'Courier New',monospace;transition:all 0.25s;backdrop-filter:blur(10px)}
.home-btn:hover{background:rgba(100,200,255,0.08);border-color:rgba(100,200,255,0.45);color:rgba(100,200,255,0.95)}
.home-btn.primary{border-color:rgba(100,200,255,0.30);color:rgba(100,200,255,0.7)}
#home-count{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,0.12);text-transform:uppercase;margin-top:40px}
/* ── LEGENDS VIEW ── */
#view-legends{position:fixed;top:48px;right:0;bottom:0;width:min(440px,100vw);z-index:20;overflow-y:auto;background:rgba(4,4,8,0.88);backdrop-filter:blur(20px);padding:32px 24px 80px;display:none;border-left:1px solid rgba(255,255,255,0.05)}
#view-legends::-webkit-scrollbar{width:2px}
#view-legends::-webkit-scrollbar-thumb{background:rgba(100,200,255,0.25)}
#leg-title{font-size:8px;letter-spacing:8px;color:rgba(100,200,255,0.4);text-transform:uppercase;margin-bottom:6px}
#leg-sub{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,0.15);text-transform:uppercase;margin-bottom:36px}
.leg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.leg-card{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);padding:18px 16px;cursor:pointer;transition:all 0.22s;position:relative;overflow:hidden}
.leg-card:hover{background:rgba(100,200,255,0.06);border-color:rgba(100,200,255,0.28)}
.leg-card.active{background:rgba(100,200,255,0.10);border-color:rgba(100,200,255,0.55)}
.leg-card-num{font-size:7px;letter-spacing:2px;color:rgba(255,255,255,0.18);text-transform:uppercase;margin-bottom:6px}
.leg-card-name{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.72);text-transform:uppercase;margin-bottom:4px}
.leg-card-type{font-size:7px;letter-spacing:2px;color:rgba(100,200,255,0.38);text-transform:uppercase}
.leg-card-glow{position:absolute;top:0;right:0;width:40px;height:40px;background:radial-gradient(circle at top right,rgba(100,200,255,0.08),transparent);pointer-events:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,0.72) 100%)}
.ripple{position:fixed;pointer-events:none;z-index:15;width:28px;height:28px;margin:-14px 0 0 -14px;border:1px solid rgba(100,200,255,0.85);border-radius:50%;animation:rout 0.5s ease-out forwards}
@keyframes rout{to{width:56px;height:56px;margin:-28px 0 0 -28px;opacity:0}}
/* ── LEGEND ARROWS ── */
#legend-arrows{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:10;display:none;gap:12px}
.larr{background:rgba(5,5,15,0.7);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.4);font-size:9px;letter-spacing:2px;padding:8px 18px;cursor:pointer;font-family:'Courier New',monospace;text-transform:uppercase;transition:all 0.2s;backdrop-filter:blur(10px)}
.larr:hover{border-color:rgba(100,200,255,0.4);color:rgba(100,200,255,0.8)}
.larr.center{background:rgba(100,200,255,0.08);border-color:rgba(100,200,255,0.35);color:rgba(100,200,255,0.7);min-width:120px;text-align:center}
/* ── CATALOGUE GRID ── */
#view-all{position:fixed;inset:0;top:48px;z-index:20;overflow-y:auto;background:rgba(4,4,8,0.92);backdrop-filter:blur(20px);padding:28px 20px 80px;display:none}
#view-all::-webkit-scrollbar{width:2px}
#view-all::-webkit-scrollbar-thumb{background:rgba(100,200,255,0.2)}
.cat-section{margin-bottom:28px}
.cat-title{font-size:7px;letter-spacing:4px;color:rgba(100,200,255,0.4);text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.05)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.cat-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);padding:12px 10px;cursor:pointer;transition:all 0.2s}
.cat-card:hover{background:rgba(100,200,255,0.07);border-color:rgba(100,200,255,0.3);transform:translateY(-1px)}
.cat-card-num{font-size:6px;letter-spacing:2px;color:rgba(255,255,255,0.18);margin-bottom:4px}
.cat-card-name{font-size:9px;letter-spacing:1px;color:rgba(255,255,255,0.7);text-transform:uppercase;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-card-badge{display:inline-block;font-size:6px;letter-spacing:1px;padding:2px 5px;text-transform:uppercase}
.badge-orig{background:rgba(100,200,255,0.12);color:rgba(100,200,255,0.7)}
.badge-glb{background:rgba(100,255,150,0.10);color:rgba(100,255,150,0.6)}
.badge-sf{background:rgba(255,180,50,0.10);color:rgba(255,180,50,0.6)}
.badge-obj{background:rgba(200,100,255,0.10);color:rgba(200,100,255,0.6)}
.badge-print{background:rgba(255,80,80,0.10);color:rgba(255,120,120,0.6)}

</head>

function disposeModel(){
  if(!loadedModel)return;
  scene.remove(loadedModel);
  loadedModel.traverse(function(o){
    if(o.geometry)o.geometry.dispose();
    if(o.material){var ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(function(m){Object.values(m).forEach(function(v){if(v&&v.isTexture)v.dispose();});m.dispose();});}
  });
  loadedModel=null;
  if(mixer){mixer.stopAllAction();mixer=null;}
  animActions={};currentAction=null;clickMeshes=[];snakeBones=null;
}
function disposeModelSilent(m,mx){
  if(!m)return;
  scene.remove(m);
  m.traverse(function(o){
    if(o.geometry)o.geometry.dispose();
    if(o.material){var ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(function(mt){mt.dispose();});}
  });
  if(mx)mx.stopAllAction();
}

function mapAnim(name){
  var map={idle:['Idle','idle','Bind','TPose','walk'],walk:['Walk','walk','Run','run'],react:['Jump','React','Run','Walk'],dance:['Dance','Wave','Celebrate','Walk'],think:['Think','Idle'],charge:['Run','Attack','Walk']};
  var tries=map[name]||['Walk'];
  for(var i=0;i<tries.length;i++){
    if(animActions[tries[i]])return tries[i];
    var keys=Object.keys(animActions);
    for(var k=0;k<keys.length;k++)if(keys[k].toLowerCase().indexOf(tries[i].toLowerCase())!==-1)return keys[k];
  }
  return Object.keys(animActions)[0];
}

function crossFade(clipName,dur){
  var next=animActions[clipName];
  if(!next||next===currentAction)return;
  next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(dur||0.4).play();
  if(currentAction)currentAction.fadeOut(dur||0.4);
  currentAction=next;
}

var petT=0;
function animatePets(dt,t){
  petT+=dt;
  // Wolf (Snake's pet) - paces and looks up
  var wolfR=Math.sin(petT*0.8)*0.4;
  petWolf.position.x=-1.2+Math.sin(petT*0.5)*0.3;
  petWolf.rotation.y=Math.sin(petT*0.5)*0.5;
  // Tail wag
  var wolfTail=petWolf.children[petWolf.children.length-1];
  if(wolfTail)wolfTail.rotation.z=-0.9+Math.sin(petT*4)*0.4;
  // Dog (Humanoid's pet) - bouncy walk
  petDog.position.x=1.2+Math.sin(petT*0.7)*0.35;
  petDog.position.y=Math.abs(Math.sin(petT*2.5))*0.04;
  petDog.rotation.y=Math.sin(petT*0.7)*0.6;
  var dogTail=petDog.children[petDog.children.length-1];
  if(dogTail)dogTail.rotation.z=-0.9+Math.sin(petT*6)*0.5;
}

var bursts=[];
function burst(pt,col){
  var cnt=18,geo=new THREE.BufferGeometry(),pos=new Float32Array(cnt*3);
  for(var i=0;i<cnt;i++){pos[i*3]=pt.x;pos[i*3+1]=pt.y;pos[i*3+2]=pt.z;}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var pts=new THREE.Points(geo,new THREE.PointsMaterial({color:col,size:0.038,transparent:true,opacity:1,sizeAttenuation:true}));
  scene.add(pts);
  var vl=[];for(var i=0;i<cnt;i++)vl.push({x:(Math.random()-0.5)*0.09,y:Math.random()*0.09+0.02,z:(Math.random()-0.5)*0.09});
  bursts.push({pts:pts,vl:vl,life:1.0});
}

  ['idle','walk','think','idle','idle'],

function buildLegendOnStage(){

function animateDualLegends(t,dt){
  if(currentView!=='home')return;
  for(var li=0;li<2;li++){
    var B=legendBones[li];
    var em=legendEmos[li];
    if(!B)continue;
    // Advance emotion cycle
    legendEmoTimers[li]+=dt;
    var cycDur=legendEmoDurs[li][legendEmoCycleIdx[li]];
    if(legendEmoTimers[li]>cycDur){
      legendEmoTimers[li]=0;
      legendEmoCycleIdx[li]=(legendEmoCycleIdx[li]+1)%legendEmoCycles[li].length;
      legendEmos[li]=legendEmoCycles[li][legendEmoCycleIdx[li]];
    }
    em=legendEmos[li];
    if(em==='idle'){
      if(B.torso)B.torso.rotation.x=Math.sin(t*0.9+li)*0.010;
      if(B.head){B.head.rotation.y=Math.sin(t*0.4+li)*0.15;B.head.rotation.x=Math.sin(t*0.3)*0.04;}
      if(B.arm_L)B.arm_L.rotation.z=0.10+Math.sin(t*0.9)*0.015;
      if(B.arm_R)B.arm_R.rotation.z=-0.10+Math.sin(t*0.9)*0.015;
    }
    if(em==='walk'){
      var ws=2.8;
      if(B.thigh_L)B.thigh_L.rotation.x=Math.sin(t*ws+li)*0.50;
      if(B.thigh_R)B.thigh_R.rotation.x=-Math.sin(t*ws+li)*0.50;
      if(B.shin_L)B.shin_L.rotation.x=Math.max(0,Math.sin(t*ws+0.8+li))*0.68;
      if(B.shin_R)B.shin_R.rotation.x=Math.max(0,Math.sin(t*ws+0.8+Math.PI+li))*0.68;
      if(B.arm_L){B.arm_L.rotation.x=-Math.sin(t*ws+li)*0.35;B.arm_L.rotation.z=0.10;}
      if(B.arm_R){B.arm_R.rotation.x=Math.sin(t*ws+li)*0.35;B.arm_R.rotation.z=-0.10;}
    }
    if(em==='think'){
      if(B.head){B.head.rotation.x=-0.15+Math.sin(t*0.4)*0.03;B.head.rotation.y=Math.sin(t*0.3)*0.2;}
      if(B.arm_R){B.arm_R.rotation.x=0.55;B.arm_R.rotation.z=-0.35;}
    }
    if(em==='charge'){
      if(B.torso)B.torso.rotation.x=-0.16+Math.sin(t*6)*0.025;
      if(B.head){B.head.rotation.x=-0.20;B.head.rotation.y=Math.sin(t*2)*0.08;}
      if(B.arm_L){B.arm_L.rotation.x=-0.38;B.arm_L.rotation.z=0.18;}
      if(B.arm_R){B.arm_R.rotation.x=-0.38;B.arm_R.rotation.z=-0.18;}
    }
    if(em==='react'){
      if(B.torso)B.torso.rotation.x=Math.sin(t*8)*0.08;
      if(B.head){B.head.rotation.x=Math.sin(t*9)*0.06;B.head.rotation.z=Math.sin(t*7)*0.05;}
      if(B.arm_L){B.arm_L.rotation.x=Math.sin(t*7)*0.3;B.arm_L.rotation.z=0.18+Math.sin(t*9)*0.1;}
      if(B.arm_R){B.arm_R.rotation.x=-Math.sin(t*7)*0.3;B.arm_R.rotation.z=-0.18-Math.sin(t*9)*0.1;}
    }
    // Blinking
    if(B.eye_L&&B.eye_R){var bl=((t*0.3+li*1.5)%1)>0.96?0.1:1.0;B.eye_L.scale.y+=(bl-B.eye_L.scale.y)*0.3;if(B.eye_R)B.eye_R.scale.y=B.eye_L.scale.y;}
  }
}

    if(!isSnake)isSnake=false;
    var total=CHARS.filter(function(c){return c.type!=='sep';}).length;
    document.getElementById('home-count').textContent=total+' entities in catalogue';
    // Camera to see both legends
    controls.target.set(0,0.9,0.2);
    camera.position.set(0,1.3,4.5);
    controls.update();
    showcaseTimer=0;greetTimer=0;greetPhase='in';
  } else if(name==='legends'){
    legends.style.display='block';
    controls.target.set(0,0.9,0);
    camera.position.set(0,1.3,4.5);
    controls.update();
  } else if(name==='all'){
    viewAll.style.display='block';
    buildAllCatalogue();
  } else if(name==='browse'){
    hudT.style.display='flex';hudB.style.display='flex';
    hint.style.display='block';stats.style.display='flex';
    charList.style.display='flex';snakeBtn.style.display='block';
    if(!browseInitialized){browseInitialized=true;loadChar(4);} // first GLB
  }
};

function buildAllCatalogue(){
  var el=document.getElementById('all-content');
  if(el.dataset.built)return;
  el.dataset.built='1';
  var sections=[
    {title:'AVIDAA Originals',types:['proc','proc2','proc3','proc4'],badge:'badge-orig',label:'Original'},
    {title:'Characters',types:['glb'],badge:'badge-glb',label:'GLB'},
    {title:'Objects',types:['obj'],badge:'badge-obj',label:'Object'},
    {title:'Sketchfab',types:['sf'],badge:'badge-sf',label:'SF'},
    {title:'3D Print',types:['print'],badge:'badge-print',label:'Print'}
  ];
  var counter=1;
  sections.forEach(function(sec){
    var items=CHARS.filter(function(c){return sec.types.indexOf(c.type)!==-1;});
    if(!items.length)return;
    var section=document.createElement('div');section.className='cat-section';
    section.innerHTML='<div class="cat-title">'+sec.title+'</div>';
    var grid=document.createElement('div');grid.className='cat-grid';
    items.forEach(function(ch){
      var idx=CHARS.indexOf(ch);
      var card=document.createElement('div');card.className='cat-card';
      card.innerHTML='<div class="cat-card-num">'+String(counter).padStart(2,'0')+'</div>'+
        '<div class="cat-card-name">'+ch.name+'</div>'+
        '<span class="cat-card-badge '+sec.badge+'">'+sec.label+'</span>';
      card.onclick=function(){showView('browse');loadChar(idx);};
      grid.appendChild(card);counter++;
    });
    section.appendChild(grid);
    el.appendChild(section);
  });
}


// ── RENDER LOOP ───────────────────────────────────────────────────
var clock=new THREE.Clock(),autoSpin=true,spinTimer=0,fpsCnt=0,fpsT=0;
controls.addEventListener('start',function(){autoSpin=false;spinTimer=0;});
controls.addEventListener('end',function(){spinTimer=5;});

function animate(){
  requestAnimationFrame(animate);
  if(isSnake)return;
  var dt=clock.getDelta(),t=clock.getElapsedTime();
  fpsCnt++;fpsT+=dt;if(fpsT>=1){document.getElementById('hud-fps').textContent=fpsCnt+' fps';fpsCnt=0;fpsT=0;}
  if(!autoSpin&&spinTimer>0){spinTimer-=dt;if(spinTimer<=0)autoSpin=true;}
  if(mixer&&!isNaN(dt))mixer.update(dt);
  tickShowcase(dt);
  tickGreeting(dt);
  animatePets(dt,t);
  animateDualLegends(t,dt);
  // Procedural Snake bone animations
  if(snakeBones){
    var B=snakeBones;
    if(emo==='idle'){
      if(B.torso)B.torso.rotation.x=Math.sin(t*0.9)*0.012;
      if(B.head){B.head.rotation.y=Math.sin(t*0.4)*0.12;B.head.rotation.x=Math.sin(t*0.35)*0.04;}
      if(B.arm_L)B.arm_L.rotation.z=0.12+Math.sin(t*0.9)*0.018;
      if(B.arm_R)B.arm_R.rotation.z=-0.12+Math.sin(t*0.9)*0.018;
    }
    if(emo==='walk'){
      var ws=2.8;
      if(B.thigh_L)B.thigh_L.rotation.x=Math.sin(t*ws)*0.52;
      if(B.thigh_R)B.thigh_R.rotation.x=-Math.sin(t*ws)*0.52;
      if(B.shin_L)B.shin_L.rotation.x=Math.max(0,Math.sin(t*ws+0.8))*0.72;
      if(B.shin_R)B.shin_R.rotation.x=Math.max(0,Math.sin(t*ws+0.8+Math.PI))*0.72;
      if(B.arm_L){B.arm_L.rotation.x=-Math.sin(t*ws)*0.38;B.arm_L.rotation.z=0.1;}
      if(B.arm_R){B.arm_R.rotation.x=Math.sin(t*ws)*0.38;B.arm_R.rotation.z=-0.1;}
      if(B.torso)B.torso.rotation.z=Math.sin(t*ws)*0.055;
    }
    if(emo==='dance'){
      var ds=3.5;
      if(B.torso){B.torso.rotation.z=Math.sin(t*ds)*0.22;B.torso.rotation.y=Math.sin(t*ds*0.5)*0.18;}
      if(B.head){B.head.rotation.z=Math.sin(t*ds*0.7)*0.2;B.head.rotation.y=Math.sin(t*ds*0.5)*0.22;}
      if(B.arm_L){B.arm_L.rotation.x=Math.sin(t*ds)*0.8;B.arm_L.rotation.z=0.3+Math.sin(t*ds*1.3)*0.5;}
      if(B.arm_R){B.arm_R.rotation.x=-Math.sin(t*ds)*0.8;B.arm_R.rotation.z=-0.3-Math.sin(t*ds*1.3)*0.5;}
      if(B.thigh_L)B.thigh_L.rotation.x=Math.sin(t*ds*1.2)*0.4;
      if(B.thigh_R)B.thigh_R.rotation.x=-Math.sin(t*ds*1.2)*0.4;
      if(loadedModel)loadedModel.rotation.y+=dt*Math.sin(t*0.5)*0.4;
    }
    if(emo==='think'){
      if(B.head){B.head.rotation.x=-0.12+Math.sin(t*0.5)*0.04;B.head.rotation.y=Math.sin(t*0.3)*0.18;}
      if(B.arm_R){B.arm_R.rotation.x=0.6;B.arm_R.rotation.z=-0.4;}
      if(B.arm_L)B.arm_L.rotation.z=0.08;
      if(B.torso)B.torso.rotation.x=0.05+Math.sin(t*0.8)*0.02;
    }
    if(emo==='charge'){
      var cs=6;
      if(B.torso)B.torso.rotation.x=-0.18+Math.sin(t*cs)*0.03;
      if(B.head){B.head.rotation.x=-0.22;B.head.rotation.y=Math.sin(t*2)*0.08;}
      if(B.arm_L){B.arm_L.rotation.x=-0.4;B.arm_L.rotation.z=0.2+Math.sin(t*cs)*0.05;}
      if(B.arm_R){B.arm_R.rotation.x=-0.4;B.arm_R.rotation.z=-0.2+Math.sin(t*cs)*0.05;}
    }
    if(emo==='react'){
      if(B.torso)B.torso.rotation.x=Math.sin(t*8)*0.08;
      if(B.head){B.head.rotation.x=Math.sin(t*9)*0.06;B.head.rotation.z=Math.sin(t*7)*0.05;}
      if(B.arm_L){B.arm_L.rotation.x=Math.sin(t*7)*0.3;B.arm_L.rotation.z=0.2+Math.sin(t*9)*0.1;}
      if(B.arm_R){B.arm_R.rotation.x=-Math.sin(t*7)*0.3;B.arm_R.rotation.z=-0.2-Math.sin(t*9)*0.1;}
    }
    if(B.eye_L&&B.eye_R){var bl=((t*0.35)%1)>0.96?0.1:1.0;B.eye_L.scale.y+=(bl-B.eye_L.scale.y)*0.3;B.eye_R.scale.y=B.eye_L.scale.y;}
    if(B.brow_L&&B.brow_R){var bt=(emo==='think')?0.012:(emo==='charge')?0.018:0;B.brow_L.position.y+=(bt-B.brow_L.position.y)*0.05;B.brow_R.position.y=B.brow_L.position.y;}
  }
  if(loadedModel&&autoSpin)loadedModel.rotation.y+=dt*0.25;
  rimColC.lerp(rimColT,0.055);rimL.color.copy(rimColC);pMat.color.copy(rimColC);
  rimL.intensity=EMO[emo].rimI;
  var pa=pGeo.attributes.position.array;
  for(var i=0;i<PCNT;i++){pD[i].a+=pD[i].spd*1.2;pD[i].h+=pD[i].vy*0.5;if(pD[i].h>2.5)pD[i].h=0;pa[i*3]=Math.cos(pD[i].a)*pD[i].r;pa[i*3+1]=pD[i].h;pa[i*3+2]=Math.sin(pD[i].a)*pD[i].r;}
  pGeo.attributes.position.needsUpdate=true;pMat.opacity=0.30+Math.sin(t*0.9)*0.12;
  ringMat.opacity=0.28+Math.sin(t*1.3)*0.16;
  for(var b=bursts.length-1;b>=0;b--){var bs=bursts[b];bs.life-=dt*1.8;if(bs.life<=0){scene.remove(bs.pts);bursts.splice(b,1);continue;}var ba=bs.pts.geometry.attributes.position.array;for(var j=0;j<bs.vl.length;j++){ba[j*3]+=bs.vl[j].x;ba[j*3+1]+=bs.vl[j].y;ba[j*3+2]+=bs.vl[j].z;bs.vl[j].y-=0.003;}bs.pts.geometry.attributes.position.needsUpdate=true;bs.pts.material.opacity=bs.life;}
  controls.update();composer.render();
}
window.addEventListener('resize',function(){W=window.innerWidth;H=window.innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);composer.setSize(W,H);});

// ── INIT ──────────────────────────────────────────────────────────
animate();
buildLegendsGrid();
buildLegendOnStage(); // place both legend characters on home stage
var browseInitialized=false;
// Hide browse UI at start — canvas/stage always visible
document.getElementById('hud-top').style.display='none';
document.getElementById('hud-bottom').style.display='none';
document.getElementById('hint').style.display='none';
document.getElementById('stats').style.display='none';
document.getElementById('char-list').style.display='none';
document.getElementById('snake-btn').style.display='none';
document.getElementById('loading').classList.add('hide');
// Camera to see both legends + their houses
controls.target.set(0,0.9,0.2);
camera.position.set(0,1.3,4.5);
controls.update();
document.getElementById('home-count').textContent=
  CHARS.filter(function(c){return c.type!=='sep';}).length+' entities in catalogue';
</script>
