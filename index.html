<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENTITY — AVIDAA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#fff;user-select:none}
#loading{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.6s}
#loading.hide{opacity:0;pointer-events:none}
#l-title{font-size:10px;letter-spacing:8px;color:rgba(255,255,255,0.3);text-transform:uppercase}
#l-sub{font-size:9px;letter-spacing:3px;color:rgba(100,200,255,0.5);text-transform:uppercase;min-width:180px;text-align:center}
.pbar-wrap{width:220px;height:1px;background:rgba(255,255,255,0.08)}
.pbar{height:100%;width:0;background:rgba(100,200,255,0.9);transition:width 0.2s}
#hud-top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:10;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0.65),transparent)}
#hud-title{font-size:9px;letter-spacing:6px;color:rgba(255,255,255,0.22);text-transform:uppercase}
#hud-emotion{font-size:9px;letter-spacing:4px;color:rgba(100,200,255,0.75);text-transform:uppercase;transition:color 0.4s}
#hud-fps{font-size:8px;letter-spacing:2px;color:rgba(255,255,255,0.13)}
#hud-bottom{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:7px}
.emo-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.09);color:rgba(255,255,255,0.4);padding:7px 14px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(10px);transition:all 0.2s;font-family:'Courier New',monospace}
.emo-btn:hover{background:rgba(100,200,255,0.08);border-color:rgba(100,200,255,0.35);color:rgba(100,200,255,0.9)}
.emo-btn.on{background:rgba(100,200,255,0.12);border-color:rgba(100,200,255,0.75);color:rgb(100,200,255)}
#hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:3px;color:rgba(255,255,255,0.12);text-transform:uppercase;z-index:10;pointer-events:none;white-space:nowrap}
#tooltip{position:fixed;pointer-events:none;z-index:20;padding:5px 12px;background:rgba(0,0,0,0.88);border:1px solid rgba(100,200,255,0.38);font-size:8px;letter-spacing:3px;color:rgba(100,200,255,0.9);text-transform:uppercase;display:none}
/* CHARACTER LIST — right side */
#char-list{position:fixed;right:16px;top:68px;z-index:10;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 140px);overflow-y:auto}
#char-list::-webkit-scrollbar{width:2px}
#char-list::-webkit-scrollbar-thumb{background:rgba(100,200,255,0.3)}
.char-item{background:rgba(5,5,15,0.80);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.32);padding:6px 12px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(10px);transition:all 0.2s;font-family:'Courier New',monospace;white-space:nowrap;display:flex;align-items:center;gap:8px;min-width:130px}
.char-item:hover{border-color:rgba(100,200,255,0.28);color:rgba(100,200,255,0.8)}
.char-item.active{background:rgba(100,200,255,0.10);border-color:rgba(100,200,255,0.65);color:rgb(100,200,255)}
.char-item.loading{opacity:0.5;pointer-events:none}
.char-num{font-size:7px;color:rgba(255,255,255,0.2);min-width:16px}
.char-item.active .char-num{color:rgba(100,200,255,0.5)}
.char-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.15);flex-shrink:0}
.char-item.active .char-dot{background:rgba(100,200,255,0.8)}
.char-item.loading .char-dot{background:rgba(255,200,0,0.8);animation:blink 0.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
/* Entity 02 Sketchfab button */
#snake-btn{position:fixed;right:16px;bottom:28px;z-index:10;background:rgba(5,5,15,0.82);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.32);padding:7px 14px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(10px);transition:all 0.2s;font-family:'Courier New',monospace}
#snake-btn:hover{border-color:rgba(100,200,255,0.28);color:rgba(100,200,255,0.8)}
#snake-btn.on{background:rgba(100,200,255,0.10);border-color:rgba(100,200,255,0.65);color:rgb(100,200,255)}
/* Stats */
#stats{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:10;pointer-events:none;display:flex;flex-direction:column;gap:12px}
.st{display:flex;flex-direction:column;gap:2px}
.st-l{font-size:7px;letter-spacing:2px;color:rgba(255,255,255,0.14);text-transform:uppercase}
.st-v{font-size:9px;letter-spacing:1px;color:rgba(100,200,255,0.5)}
/* Sketchfab overlay */
#sf-overlay{position:fixed;inset:0;z-index:50;display:none;background:#000;overflow:hidden}
#sf-iframe-container{position:absolute;top:0;left:0;width:100%;height:100%}
#sf-iframe-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
#sf-back{position:fixed;right:16px;bottom:28px;z-index:65;background:rgba(100,200,255,0.10);border:1px solid rgba(100,200,255,0.5);color:rgb(100,200,255);padding:7px 14px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Courier New',monospace;display:none}
.corner{position:fixed;width:18px;height:18px;z-index:10;pointer-events:none}
.corner.tl{top:12px;left:12px;border-top:1px solid rgba(255,255,255,0.1);border-left:1px solid rgba(255,255,255,0.1)}
.corner.tr{top:12px;right:12px;border-top:1px solid rgba(255,255,255,0.1);border-right:1px solid rgba(255,255,255,0.1)}
.corner.bl{bottom:12px;left:12px;border-bottom:1px solid rgba(255,255,255,0.1);border-left:1px solid rgba(255,255,255,0.1)}
.corner.br{bottom:12px;right:12px;border-bottom:1px solid rgba(255,255,255,0.1);border-right:1px solid rgba(255,255,255,0.1)}
#scanlines{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px)}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,0.72) 100%)}
.ripple{position:fixed;pointer-events:none;z-index:15;width:28px;height:28px;margin:-14px 0 0 -14px;border:1px solid rgba(100,200,255,0.85);border-radius:50%;animation:rout 0.5s ease-out forwards}
@keyframes rout{to{width:56px;height:56px;margin:-28px 0 0 -28px;opacity:0}}
</style>
</head>
<body>
<div id="loading">
  <div id="l-title">Entity — AVIDAA</div>
  <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
  <div id="l-sub">Loading</div>
</div>
<div id="hud-top">
  <div id="hud-title">Entity — AVIDAA</div>
  <div id="hud-emotion">Idle</div>
  <div id="hud-fps">— fps</div>
</div>
<div id="hint">Drag · Scroll · Click</div>
<div id="hud-bottom">
  <button class="emo-btn on" onclick="setEmo('idle',this)">Idle</button>
  <button class="emo-btn"   onclick="setEmo('walk',this)">Walk</button>
  <button class="emo-btn"   onclick="setEmo('react',this)">React</button>

  <div class="st"><div class="st-l">Character</div><div class="st-v" id="sv-name">—</div></div>

</div>

</div>

<div class="corner bl"></div><div class="corner br"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
// ── CHARACTER LIST ────────────────────────────────────────────────
var CHARS=[
  {name:'CesiumMan',     file:'models/01.glb', type:'glb'},
  {name:'Robot',         file:'models/02.glb', type:'glb'},
  {name:'Soldier',       file:'models/03.glb', type:'glb'},
  {name:'Michelle',      file:'models/04.glb', type:'glb'},
  {name:'Xbot',          file:'models/05.glb', type:'glb'},
  {name:'Avatar',        file:'models/06.glb', type:'glb'},
  {name:'Flamingo',      file:'models/07.glb', type:'glb'},
  {name:'Horse',         file:'models/08.glb', type:'glb'},
  {name:'Parrot',        file:'models/09.glb', type:'glb'},
  {name:'Stork',         file:'models/10.glb', type:'glb'},
  {name:'Naked Snake',   sfId:'37687b934c504f8593722375ed21666c', type:'sf'},
  {name:'Snake & Quiet', sfId:'8aa886fc7b064833a1d8985cd453056d', type:'sf'},
  {name:'SOCOM Mk23',    sfId:'369ef7a30b54460eb5a9f6cef5ba4928', type:'sf'},
  {name:'Gray Fox',      sfId:'138945985b714715b30a5933b3564c15', type:'sf'}
];

// Build character list UI
var charListEl=document.getElementById('char-list');
CHARS.forEach(function(ch,i){
  var el=document.createElement('div');
  el.className='char-item'+(i===0?' active':'');
  el.id='ci-'+i;
  el.onclick=function(){loadChar(i);};
  var num=(i+1)<10?'0'+(i+1):''+(i+1);
  var badge=ch.type==='sf'?' <span style="font-size:6px;color:rgba(100,200,255,0.4);letter-spacing:1px">SF</span>':'';
  el.innerHTML='<span class="char-num">'+num+'</span><span class="char-dot"></span>'+ch.name+badge;
  charListEl.appendChild(el);
});

// ── RENDERER ─────────────────────────────────────────────────────
var W=window.innerWidth,H=window.innerHeight;
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.95;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.domElement.style.cssText='position:fixed;inset:0;z-index:1';
document.body.appendChild(renderer.domElement);

var scene=new THREE.Scene();scene.background=new THREE.Color(0x040408);scene.fog=new THREE.FogExp2(0x040408,0.016);
var camera=new THREE.PerspectiveCamera(42,W/H,0.01,200);camera.position.set(0,1.4,3.8);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.9,0);controls.enableDamping=true;controls.dampingFactor=0.06;
controls.minDistance=0.3;controls.maxDistance=18;controls.maxPolarAngle=Math.PI*0.88;controls.update();

var pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.02).texture;
scene.add(new THREE.AmbientLight(0xfff0e8,0.18));
var keyL=new THREE.DirectionalLight(0xfff5e8,1.0);
keyL.position.set(3,7,4);keyL.castShadow=true;
keyL.shadow.mapSize.width=keyL.shadow.mapSize.height=4096;
keyL.shadow.camera.left=-4;keyL.shadow.camera.right=4;
keyL.shadow.camera.top=8;keyL.shadow.camera.bottom=-1;keyL.shadow.bias=-0.0001;
scene.add(keyL);
var fillL2=new THREE.DirectionalLight(0x3060ff,0.22);fillL2.position.set(-4,3,-2);scene.add(fillL2);
var rimL=new THREE.DirectionalLight(0x64c8ff,0.50);rimL.position.set(0,3,-5);scene.add(rimL);

var gndMat=new THREE.MeshStandardMaterial({color:0x060610,roughness:0.12,metalness:0.92,envMapIntensity:1.4});
var gnd=new THREE.Mesh(new THREE.CircleGeometry(14,72),gndMat);gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);
var ringMat=new THREE.MeshBasicMaterial({color:0x1a3a5c,side:THREE.DoubleSide,transparent:true,opacity:0.4});
var ringMesh=new THREE.Mesh(new THREE.RingGeometry(0.55,0.75,72),ringMat);ringMesh.rotation.x=-Math.PI/2;ringMesh.position.y=0.002;scene.add(ringMesh);

(function(){var sg=new THREE.BufferGeometry(),sp=new Float32Array(1400*3);
for(var i=0;i<1400;i++){var th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=55+Math.random()*35;sp[i*3]=r*Math.sin(ph)*Math.cos(th);sp[i*3+1]=r*Math.sin(ph)*Math.sin(th);sp[i*3+2]=r*Math.cos(ph);}
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.1,transparent:true,opacity:0.45,sizeAttenuation:true})));})();

var composer=new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene,camera));
var bloom=new THREE.UnrealBloomPass(new THREE.Vector2(W,H),0.18,0.4,0.90);
composer.addPass(bloom);

var PCNT=380,pGeo=new THREE.BufferGeometry(),pPos=new Float32Array(PCNT*3),pD=[];
for(var i=0;i<PCNT;i++){var pa=Math.random()*Math.PI*2,pr=1.0+Math.random()*2.2,ph2=Math.random()*2.5;pPos[i*3]=Math.cos(pa)*pr;pPos[i*3+1]=ph2;pPos[i*3+2]=Math.sin(pa)*pr;pD.push({a:pa,r:pr,h:ph2,spd:0.002+Math.random()*0.005,vy:0.001+Math.random()*0.003});}
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
var pMat=new THREE.PointsMaterial({color:0x64c8ff,size:0.016,transparent:true,opacity:0.42,sizeAttenuation:true});
scene.add(new THREE.Points(pGeo,pMat));

// ── EMOTIONS ─────────────────────────────────────────────────────
var EMO={
  idle:{label:'Idle — Observing',col:0x64c8ff,bloom:0.18,rimI:0.50},
  walk:{label:'Walking — Moving',col:0x44ffcc,bloom:0.22,rimI:0.60},
  react:{label:'Reactive — Engaged',col:0xff4466,bloom:0.35,rimI:0.85},
  dance:{label:'Expressive — Moving',col:0xaa44ff,bloom:0.28,rimI:0.70},
  think:{label:'Processing — Thinking',col:0x44ffbb,bloom:0.18,rimI:0.35},
  charge:{label:'Charging — Power',col:0xff8800,bloom:0.40,rimI:1.0}
};
var emo='idle',rimColT=new THREE.Color(0x64c8ff),rimColC=new THREE.Color(0x64c8ff);

// ── MODEL STATE ───────────────────────────────────────────────────
var loadedModel=null,mixer=null,animActions={},currentAction=null,clickMeshes=[];
var activeCharIdx=0,isSnake=false;

function disposeModel(){
  if(!loadedModel)return;
  scene.remove(loadedModel);
  loadedModel.traverse(function(o){
    if(o.geometry)o.geometry.dispose();
    if(o.material){var ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(function(m){Object.values(m).forEach(function(v){if(v&&v.isTexture)v.dispose();});m.dispose();});}
  });
  loadedModel=null;
  if(mixer){mixer.stopAllAction();mixer=null;}
  animActions={};currentAction=null;clickMeshes=[];
}

function mapAnim(name){
  var map={idle:['Idle','idle','Bind','TPose','walk'],walk:['Walk','walk','Run','run'],react:['Jump','React','Run','Walk'],dance:['Dance','Wave','Celebrate','Walk'],think:['Think','Idle'],charge:['Run','Attack','Walk']};
  var tries=map[name]||['Walk'];
  for(var i=0;i<tries.length;i++){
    if(animActions[tries[i]])return tries[i];
    var keys=Object.keys(animActions);
    for(var k=0;k<keys.length;k++)if(keys[k].toLowerCase().indexOf(tries[i].toLowerCase())!==-1)return keys[k];
  }
  return Object.keys(animActions)[0];
}

function crossFade(clipName,dur){
  var next=animActions[clipName];
  if(!next||next===currentAction)return;
  next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(dur||0.4).play();
  if(currentAction)currentAction.fadeOut(dur||0.4);
  currentAction=next;
}

var loader=new THREE.GLTFLoader();

function loadChar(idx){
  if(idx===activeCharIdx&&loadedModel&&CHARS[idx].type==='glb')return;
  activeCharIdx=idx;
  // Handle Sketchfab type
  if(CHARS[idx].type==='sf'){
    disposeModel();
    document.querySelectorAll('.char-item').forEach(function(el,i){el.className='char-item'+(i===idx?' active':'');});
    document.getElementById('sv-name').textContent=CHARS[idx].name;
    document.getElementById('sv-state').textContent='Sketchfab';
    document.getElementById('sv-parts').textContent='—';
    document.getElementById('sv-anims').textContent='—';
    // Show Sketchfab overlay with correct model
    var sfOv=document.getElementById('sf-overlay');
    document.getElementById('sf-iframe-container').innerHTML='<iframe frameborder="0" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" src="https://sketchfab.com/models/'+CHARS[idx].sfId+'/embed?autostart=1&ui_theme=dark"></iframe>';
    sfOv.style.display='block';
    document.getElementById('hud-bottom').style.display='none';
    document.getElementById('hint').style.display='none';
    document.getElementById('stats').style.display='none';
    document.getElementById('hud-top').style.display='none';
    document.getElementById('snake-btn').style.display='none';
    document.getElementById('sf-back').style.display='block';
    isSnake=true;
    return;
  }
  // GLB type — hide SF overlay if visible
  if(isSnake){
    document.getElementById('sf-overlay').style.display='none';
    document.getElementById('hud-bottom').style.display='flex';
    document.getElementById('hint').style.display='block';
    document.getElementById('stats').style.display='flex';
    document.getElementById('hud-top').style.display='flex';
    document.getElementById('snake-btn').style.display='block';
    document.getElementById('sf-back').style.display='none';
    isSnake=false;
  }
  // Update UI
  document.querySelectorAll('.char-item').forEach(function(el,i){
    el.className='char-item'+(i===idx?' active loading':'');
  });
  document.getElementById('pbar').style.width='0%';
  document.getElementById('l-sub').textContent='Loading '+CHARS[idx].name;
  document.getElementById('loading').classList.remove('hide');
  document.getElementById('sv-name').textContent=CHARS[idx].name;
  document.getElementById('sv-state').textContent='Loading';
  document.getElementById('sv-parts').textContent='—';
  document.getElementById('sv-anims').textContent='—';
  disposeModel();

  loader.load(CHARS[idx].file,
    function(gltf){
      var model=gltf.scene;
      var box=new THREE.Box3().setFromObject(model);
      var size=box.getSize(new THREE.Vector3());
      var targetH=2.0,scale=targetH/Math.max(size.y,0.01);
      model.scale.setScalar(scale);
      box.setFromObject(model);
      var mn=box.min,ctr=box.getCenter(new THREE.Vector3());
      model.position.set(-ctr.x,-mn.y,-ctr.z);
      var mc=0;
      model.traverse(function(c){
        if(!c.isMesh)return;
        c.castShadow=true;c.receiveShadow=true;c.frustumCulled=false;
        if(c.material){var ms=Array.isArray(c.material)?c.material:[c.material];ms.forEach(function(m){if(m.isMeshStandardMaterial||m.isMeshPhongMaterial||m.isMeshLambertMaterial)m.envMapIntensity=1.2;});}
        clickMeshes.push(c);mc++;
      });
      document.getElementById('sv-parts').textContent=mc;
      if(gltf.animations&&gltf.animations.length>0){
        mixer=new THREE.AnimationMixer(model);
        gltf.animations.forEach(function(clip){animActions[clip.name]=mixer.clipAction(clip);});
        document.getElementById('sv-anims').textContent=gltf.animations.length;
        var first=Object.keys(animActions)[0];
        if(first){animActions[first].play();currentAction=animActions[first];}
      }
      controls.target.set(0,targetH*0.45,0);
      camera.position.set(0,targetH*0.55,targetH*2.0);
      controls.update();
      scene.add(model);loadedModel=model;
      document.querySelectorAll('.char-item').forEach(function(el,i){el.className='char-item'+(i===idx?' active':'');});
      document.getElementById('sv-state').textContent=emo.charAt(0).toUpperCase()+emo.slice(1);
      document.getElementById('pbar').style.width='100%';
      document.getElementById('l-sub').textContent=CHARS[idx].name+' Ready';
      setTimeout(function(){document.getElementById('loading').classList.add('hide');},400);
    },
    function(xhr){if(xhr.total>0)document.getElementById('pbar').style.width=Math.round(xhr.loaded/xhr.total*100)+'%';},
    function(err){
      document.getElementById('l-sub').textContent='Error loading '+CHARS[idx].name;
      document.querySelectorAll('.char-item').forEach(function(el,i){el.className='char-item'+(i===idx?' active':'');});
      setTimeout(function(){document.getElementById('loading').classList.add('hide');},2000);
    }
  );
}

window.setEmo=function(name,btn){
  emo=name;
  var cfg=EMO[name];
  rimColT.setHex(cfg.col);bloom.strength=cfg.bloom;
  document.getElementById('hud-emotion').textContent=cfg.label;
  document.getElementById('sv-state').textContent=name.charAt(0).toUpperCase()+name.slice(1);
  document.querySelectorAll('.emo-btn').forEach(function(b){b.classList.remove('on');});
  if(btn)btn.classList.add('on');
  var cn=mapAnim(name);if(cn)crossFade(cn);
};

// ── RAYCASTER ─────────────────────────────────────────────────────
var ray=new THREE.Raycaster(),mXY=new THREE.Vector2();
var ttip=document.getElementById('tooltip'),hovered=null,hovOrig=new THREE.Color(0,0,0);
document.addEventListener('mousemove',function(e){
  mXY.x=(e.clientX/W)*2-1;mXY.y=-(e.clientY/H)*2+1;
  ttip.style.left=(e.clientX+15)+'px';ttip.style.top=(e.clientY-8)+'px';
  if(!loadedModel||isSnake)return;
  ray.setFromCamera(mXY,camera);
  var hits=ray.intersectObjects(clickMeshes,false);
  if(hovered){if(hovered.material&&hovered.material.emissive)hovered.material.emissive.copy(hovOrig);hovered=null;ttip.style.display='none';}
  if(hits.length>0){var h=hits[0].object;if(h.material&&h.material.emissive!==undefined){hovOrig.copy(h.material.emissive);h.material.emissive.set(0x1a2a44);hovered=h;}ttip.textContent=h.name||'Mesh';ttip.style.display='block';}
});
var bursts=[];
function burst(pt,col){
  var cnt=18,geo=new THREE.BufferGeometry(),pos=new Float32Array(cnt*3);
  for(var i=0;i<cnt;i++){pos[i*3]=pt.x;pos[i*3+1]=pt.y;pos[i*3+2]=pt.z;}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var pts=new THREE.Points(geo,new THREE.PointsMaterial({color:col,size:0.038,transparent:true,opacity:1,sizeAttenuation:true}));
  scene.add(pts);
  var vl=[];for(var i=0;i<cnt;i++)vl.push({x:(Math.random()-0.5)*0.09,y:Math.random()*0.09+0.02,z:(Math.random()-0.5)*0.09});
  bursts.push({pts:pts,vl:vl,life:1.0});
}
document.addEventListener('click',function(e){
  var rip=document.createElement('div');rip.className='ripple';rip.style.left=e.clientX+'px';rip.style.top=e.clientY+'px';document.body.appendChild(rip);setTimeout(function(){rip.remove();},600);
  if(!loadedModel||isSnake)return;
  mXY.x=(e.clientX/W)*2-1;mXY.y=-(e.clientY/H)*2+1;
  ray.setFromCamera(mXY,camera);
  var hits=ray.intersectObjects(clickMeshes,false);
  if(!hits.length)return;
  burst(hits[0].point,EMO[emo].col);
  if(hits[0].object.material&&hits[0].object.material.emissive){var oc=hits[0].object.material.emissive.clone();hits[0].object.material.emissive.set(0x4466ff);setTimeout(function(){hits[0].object.material.emissive.copy(oc);},280);}
});

// ── RENDER LOOP ───────────────────────────────────────────────────
var clock=new THREE.Clock(),autoSpin=true,spinTimer=0,fpsCnt=0,fpsT=0;
controls.addEventListener('start',function(){autoSpin=false;spinTimer=0;});
controls.addEventListener('end',function(){spinTimer=5;});

function animate(){
  requestAnimationFrame(animate);
  if(isSnake)return;
  var dt=clock.getDelta(),t=clock.getElapsedTime();
  fpsCnt++;fpsT+=dt;if(fpsT>=1){document.getElementById('hud-fps').textContent=fpsCnt+' fps';fpsCnt=0;fpsT=0;}
  if(!autoSpin&&spinTimer>0){spinTimer-=dt;if(spinTimer<=0)autoSpin=true;}
  if(mixer&&!isNaN(dt))mixer.update(dt);
  if(loadedModel&&autoSpin)loadedModel.rotation.y+=dt*0.25;
  rimColC.lerp(rimColT,0.055);rimL.color.copy(rimColC);pMat.color.copy(rimColC);
  rimL.intensity=EMO[emo].rimI;
  var pa=pGeo.attributes.position.array;
  for(var i=0;i<PCNT;i++){pD[i].a+=pD[i].spd*1.2;pD[i].h+=pD[i].vy*0.5;if(pD[i].h>2.5)pD[i].h=0;pa[i*3]=Math.cos(pD[i].a)*pD[i].r;pa[i*3+1]=pD[i].h;pa[i*3+2]=Math.sin(pD[i].a)*pD[i].r;}
  pGeo.attributes.position.needsUpdate=true;pMat.opacity=0.30+Math.sin(t*0.9)*0.12;
  ringMat.opacity=0.28+Math.sin(t*1.3)*0.16;
  for(var b=bursts.length-1;b>=0;b--){var bs=bursts[b];bs.life-=dt*1.8;if(bs.life<=0){scene.remove(bs.pts);bursts.splice(b,1);continue;}var ba=bs.pts.geometry.attributes.position.array;for(var j=0;j<bs.vl.length;j++){ba[j*3]+=bs.vl[j].x;ba[j*3+1]+=bs.vl[j].y;ba[j*3+2]+=bs.vl[j].z;bs.vl[j].y-=0.003;}bs.pts.geometry.attributes.position.needsUpdate=true;bs.pts.material.opacity=bs.life;}
  controls.update();composer.render();
}
window.addEventListener('resize',function(){W=window.innerWidth;H=window.innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);composer.setSize(W,H);});

// ── INIT ──────────────────────────────────────────────────────────
animate();
loadChar(0);
</script>
