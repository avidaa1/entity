function crossFadeTo(clipName,dur){

  next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(dur).play();

  currentAction=next;

function mapEmoAnim(name){

    dance:['Dance','Wave','Celebrate','Walk'],
    think:['Idle','Think','Stand'],
    charge:['Run','Attack','Walk']

  var tries=map[name]||['Walk'];
  for(var i=0;i<tries.length;i++){
    if(animActions[tries[i]])return tries[i];
    var keys=Object.keys(animActions);
    for(var k=0;k<keys.length;k++){
      if(keys[k].toLowerCase().indexOf(tries[i].toLowerCase())!==-1)return keys[k];

  }
  return Object.keys(animActions)[0];

  loader.load(blobUrl,
  function(gltf){
    var model=gltf.scene;
    var box=new THREE.Box3().setFromObject(model);
    var size=box.getSize(new THREE.Vector3());
    var scale=1.8/Math.max(size.y,0.01);
    model.scale.setScalar(scale);
    box.setFromObject(model);
    var mn=box.getMin(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
    model.position.x=-ctr.x;model.position.y=-mn.y;model.position.z=-ctr.z;
    var mc=0;
    model.traverse(function(c){
      if(!c.isMesh)return;
      c.castShadow=true;c.receiveShadow=true;c.frustumCulled=false;
      if(c.material){
        var mats=Array.isArray(c.material)?c.material:[c.material];
        mats.forEach(function(m){if(m.isMeshStandardMaterial)m.envMapIntensity=1.4;});
      }
      clickMeshes.push(c);mc++;
    });
    document.getElementById('sv-parts').textContent=mc;
    if(gltf.animations&&gltf.animations.length>0){
      mixer=new THREE.AnimationMixer(model);
      gltf.animations.forEach(function(clip){animActions[clip.name]=mixer.clipAction(clip);});
      document.getElementById('sv-anims').textContent=gltf.animations.length;
      var first=Object.keys(animActions)[0];
      if(first){animActions[first].play();currentAction=animActions[first];}
      console.log('Clips:',Object.keys(animActions));
    }
    controls.target.set(0,0.9,0);camera.position.set(0,1.1,3.5);controls.update();
    scene.add(model);loadedModel=model;
    document.getElementById('pbar').style.width='100%';
    document.getElementById('l-sub').textContent='Entity Ready';
    setTimeout(function(){document.getElementById('loading').classList.add('hide');},400);
  },
  function(xhr){if(xhr.total>0)document.getElementById('pbar').style.width=Math.round(xhr.loaded/xhr.total*100)+'%';},
  function(err){document.getElementById('l-sub').textContent='Model load error: '+err;}
  );URL.revokeObjectURL(blobUrl);
})();

var ray=new THREE.Raycaster(),mXY=new THREE.Vector2();
var ttip=document.getElementById('tooltip'),hovered=null,hovOrig=new THREE.Color(0,0,0);
document.addEventListener('mousemove',function(e){
  mXY.x=(e.clientX/W)*2-1;mXY.y=-(e.clientY/H)*2+1;
  ttip.style.left=(e.clientX+15)+'px';ttip.style.top=(e.clientY-8)+'px';
  if(!loadedModel)return;
  ray.setFromCamera(mXY,camera);
  var hits=ray.intersectObjects(clickMeshes,false);
  if(hovered){if(hovered.material&&hovered.material.emissive)hovered.material.emissive.copy(hovOrig);hovered=null;ttip.style.display='none';}
  if(hits.length>0){
    var h=hits[0].object;
    if(h.material&&h.material.emissive!==undefined){hovOrig.copy(h.material.emissive);h.material.emissive.set(0x1a2a44);hovered=h;}
    ttip.textContent=h.name||'Body';ttip.style.display='block';
  }
});

var bursts=[];
function burst(pt,col){
  var cnt=22,geo=new THREE.BufferGeometry(),pos=new Float32Array(cnt*3);
  for(var i=0;i<cnt;i++){pos[i*3]=pt.x;pos[i*3+1]=pt.y;pos[i*3+2]=pt.z;}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var bm=new THREE.PointsMaterial({color:col,size:0.038,transparent:true,opacity:1,sizeAttenuation:true});
  var pts=new THREE.Points(geo,bm);scene.add(pts);
  var vl=[];for(var i=0;i<cnt;i++)vl.push({x:(Math.random()-0.5)*0.09,y:Math.random()*0.09+0.02,z:(Math.random()-0.5)*0.09});
  bursts.push({pts:pts,vl:vl,life:1.0});
}
document.addEventListener('click',function(e){
  var rip=document.createElement('div');rip.className='ripple';rip.style.left=e.clientX+'px';rip.style.top=e.clientY+'px';document.body.appendChild(rip);setTimeout(function(){rip.remove();},600);
  if(!loadedModel)return;
  mXY.x=(e.clientX/W)*2-1;mXY.y=-(e.clientY/H)*2+1;
  ray.setFromCamera(mXY,camera);
  var hits=ray.intersectObjects(clickMeshes,false);
  if(!hits.length)return;
  burst(hits[0].point,EMO[emo].col);
  if(hits[0].object.material&&hits[0].object.material.emissive){
    var oc=hits[0].object.material.emissive.clone();hits[0].object.material.emissive.set(0x4466ff);
    setTimeout(function(){hits[0].object.material.emissive.copy(oc);},280);
  }
});

var activeChar=1,sfLoaded=false;
window.showChar=function(n,btn){
  activeChar=n;
  var sfOv=document.getElementById('sf-overlay'),canvas=renderer.domElement;
  var hudBot=document.getElementById('hud-bottom'),hint=document.getElementById('hint'),stats=document.getElementById('stats');
  if(n===2){
    if(!sfLoaded){sfLoaded=true;
      document.getElementById('sf-iframe-container').innerHTML='<iframe title="Naked Snake (the boss) mgsvd" frameborder="0" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" src="https://sketchfab.com/models/37687b934c504f8593722375ed21666c/embed?autostart=1&ui_theme=dark"></iframe>';
      var ifr=document.querySelector('#sf-iframe-container iframe');if(ifr)ifr.onload=function(){var fb=document.getElementById('sf-fallback');if(fb)fb.style.display='none';};
    }
    sfOv.style.display='block';canvas.style.display='none';hudBot.style.display='none';hint.style.display='none';stats.style.display='none';document.getElementById('hud-top').style.display='none';
  }else{
    sfOv.style.display='none';canvas.style.display='block';hudBot.style.display='flex';hint.style.display='block';stats.style.display='flex';document.getElementById('hud-top').style.display='flex';
  }
  document.querySelectorAll('.char-btn').forEach(function(b,i){b.classList.toggle('active',i+1===n);});
};

var clock=new THREE.Clock(),autoSpin=true,spinTimer=0,fpsCnt=0,fpsT=0;
controls.addEventListener('start',function(){autoSpin=false;spinTimer=0;});
controls.addEventListener('end',function(){spinTimer=5;});

function animate(){
  requestAnimationFrame(animate);
  if(activeChar!==1)return;
  var dt=clock.getDelta(),t=clock.getElapsedTime();
  fpsCnt++;fpsT+=dt;if(fpsT>=1){document.getElementById('hud-fps').textContent=fpsCnt+' fps';fpsCnt=0;fpsT=0;}
  if(!autoSpin&&spinTimer>0){spinTimer-=dt;if(spinTimer<=0)autoSpin=true;}
  if(mixer&&!isNaN(dt))mixer.update(dt);
  if(loadedModel&&autoSpin)loadedModel.rotation.y+=dt*0.25;
  rimColC.lerp(rimColT,0.055);rimL.color.copy(rimColC);pMat.color.copy(rimColC);
  rimL.intensity=EMO[emo].rimI;
  var pa=pGeo.attributes.position.array,spdM=EMO[emo].col===0xff8800?4:1.2;
  for(var i=0;i<PCNT;i++){pD[i].a+=pD[i].spd*spdM;pD[i].h+=pD[i].vy*0.5;if(pD[i].h>2.5)pD[i].h=0;pa[i*3]=Math.cos(pD[i].a)*pD[i].r;pa[i*3+1]=pD[i].h;pa[i*3+2]=Math.sin(pD[i].a)*pD[i].r;}
  pGeo.attributes.position.needsUpdate=true;pMat.opacity=0.32+Math.sin(t*0.9)*0.12;
  ringMat.opacity=0.3+Math.sin(t*1.3)*0.18;
  for(var b=bursts.length-1;b>=0;b--){var bs=bursts[b];bs.life-=dt*1.8;if(bs.life<=0){scene.remove(bs.pts);bursts.splice(b,1);continue;}var ba=bs.pts.geometry.attributes.position.array;for(var j=0;j<bs.vl.length;j++){ba[j*3]+=bs.vl[j].x;ba[j*3+1]+=bs.vl[j].y;ba[j*3+2]+=bs.vl[j].z;bs.vl[j].y-=0.003;}bs.pts.geometry.attributes.position.needsUpdate=true;bs.pts.material.opacity=bs.life;}
  controls.update();composer.render();
}
window.addEventListener('resize',function(){W=window.innerWidth;H=window.innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);composer.setSize(W,H);});
animate();
</script>
